<text x="140" y="524" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-muted)">Complete order response</text>
<rect x="30" y="30" width="80" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
