[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iot-analytics-worker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "iii-sdk[otel]==0.8.3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
main = "src.main:main"
